name: CI

env:
  VIBE_TEST_NO_VISUALS: '1'

on:
  pull_request:
  push:
    branches:
      - '**'

jobs:
  validate:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Lint and typecheck
        run: npm run check

      - name: Run unit tests
        run: npm run test:unit

      - name: Run built library browser checks
        run: npm run test:e2e:built

      - name: Verify browser process cleanup
        run: npm run test:runner

      - name: Run e2e tests
        run: npm run test:e2e

      - name: Verify package shape
        run: npm run check:package

      - name: Build showcase
        run: npm run build:site:dev

      - name: Check showcase journeys
        run: npm run test:site

      - name: Dry-run package
        run: npm pack --dry-run
